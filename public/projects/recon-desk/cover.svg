<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Recon Desk reconciliation workflow</title><desc id="desc">Partner report imports pass through approved mappings and matching rules, then power an exception queue, evidence-backed claims, and a risk dashboard.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#161025"/><stop offset="1" stop-color="#3c285a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="m0 0 10 3-10 3z" fill="#ceb0ff"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="72" y="82" fill="#faf4ff" font-size="42" font-weight="700">RECON DESK</text><text x="74" y="118" fill="#d3b9ff" font-size="18" letter-spacing="4">D2C ORDER, SETTLEMENT, COD &amp; FREIGHT RECONCILIATION</text>
  <g fill="#201833" stroke="#8664b8" stroke-width="2"><rect x="72" y="245" width="270" height="310" rx="18"/><rect x="452" y="245" width="270" height="310" rx="18"/><rect x="832" y="245" width="270" height="310" rx="18"/><rect x="1212" y="245" width="316" height="310" rx="18"/></g>
  <g fill="#d3b9ff" font-size="17" font-weight="700" letter-spacing="2"><text x="104" y="285">PARTNER INPUTS</text><text x="484" y="285">CONTROLLED IMPORT</text><text x="864" y="285">RULES ENGINE</text><text x="1244" y="285">FINANCE ACTIONS</text></g>
  <g fill="#fbf7ff" font-size="19"><text x="107" y="350">Orders</text><text x="107" y="400">Settlements + COD</text><text x="107" y="450">Freight invoices</text><text x="107" y="500">CSV / Excel</text><text x="487" y="350">Preview 20 rows</text><text x="487" y="400">Human-approved mapping</text><text x="487" y="450">Version + rollback</text><text x="487" y="500">Idempotent re-upload</text><text x="867" y="350">Rate-card expectations</text><text x="867" y="400">Set-based SQL match</text><text x="867" y="450">₹10 tolerance</text><text x="867" y="500">Human review queue</text><text x="1247" y="350">Claims + CSV evidence</text><text x="1247" y="400">Leakage dashboard</text><text x="1247" y="450">Partner / age analysis</text><text x="1247" y="500">Audit trail</text></g>
  <path d="M342 400h92M722 400h92M1102 400h92" stroke="#ceb0ff" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <g transform="translate(168 680)"><rect width="1264" height="120" rx="18" fill="#1e162f" stroke="#7655a5" stroke-width="2"/><text x="32" y="38" fill="#d3b9ff" font-size="17" font-weight="700" letter-spacing="2">EXCEPTION OUTCOMES</text><g fill="#fbf7ff" font-size="20"><text x="33" y="82">SETTLED</text><text x="270" y="82">SHORT-PAID</text><text x="550" y="82">UNPAID PAST DUE</text><text x="880" y="82">FREIGHT OVERCHARGED</text></g><path d="M167 75h70m165 0h70m215 0h70" stroke="#ceb0ff" stroke-width="3" marker-end="url(#a)"/></g></g>
</svg>
