<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BizzInnovate LeadEngine system architecture</title><desc id="desc">LeadEngine connects its React client to FastAPI services, AI providers, validation services, a scraper, and SQLite storage.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1d1010"/><stop offset="1" stop-color="#5c3215"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="m0 0 10 3-10 3z" fill="#ffc266"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="72" y="82" fill="#fff5df" font-size="42" font-weight="700">BIZZINNOVATE LEADENGINE</text><text x="74" y="118" fill="#ffc978" font-size="18" letter-spacing="4">AI MARKET INTELLIGENCE • LEAD DISCOVERY • OUTREACH OPERATIONS</text>
  <g fill="#301c19" stroke="#b97537" stroke-width="2"><rect x="72" y="305" width="245" height="235" rx="18"/><rect x="492" y="195" width="430" height="460" rx="18"/><rect x="1097" y="195" width="430" height="460" rx="18"/></g>
  <g fill="#ffce87" font-size="18" font-weight="700" letter-spacing="2"><text x="103" y="345">OPERATOR WORKSPACE</text><text x="524" y="235">FASTAPI ENTERPRISE CORE</text><text x="1129" y="235">DATA &amp; EXTERNAL SERVICES</text></g>
  <g fill="#fff3dc" font-size="19"><text x="106" y="408">React + Vite</text><text x="106" y="452">JWT workspace</text><text x="106" y="496">Leads / CRM / campaigns</text><text x="527" y="302">Auth + encrypted vault</text><text x="527" y="365">AI gateway &amp; fallback</text><text x="527" y="428">MX verification + suppression</text><text x="527" y="491">Scraper HTTP dispatcher</text><text x="527" y="554">Deal + territory analytics</text><text x="1132" y="302">Groq + Gemini</text><text x="1132" y="365">Google Maps scraper</text><text x="1132" y="428">DNS MX lookup</text><text x="1132" y="491">SQLite + Alembic</text><text x="1132" y="554">Rolling backups</text></g>
